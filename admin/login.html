<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Hire - Admin Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }
      .login-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
        height: 100vh;
      }
      .login-image {
        width: 60%;
      }
      .login-image img {
        width: inherit;
        display: block;
        width: 1100px;
        height: 100vh;
        object-fit: cover;
      }

      .login-form {
        background-color: #fff;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .bform-group {
        margin-bottom: 20px;
        text-align: center;
      }

      label {
        display: block;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
      }

      button {
        background-color: #4caf50;
        color: #fff;
        padding: 10px 15px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-image"><img src="../images/Atenza1.png" alt="" /></div>
      <div class="login-form">
        <h2>Admin Login</h2>
        <form action="" method="post">
          <div class="form-group">
            <label for="username">Username:</label>
            <input
              type="text"
              id="username"
              name="admin_uname"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="admin_passwd" required />
          </div>

          <div class="bform-group">
            <button type="submit">Login</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
